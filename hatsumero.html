<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春日電機 BSW215B 再現コード</title>
    <style>
        :root {
            --case-bg: #e6dfd3;
            --case-shadow: #c7beaf;
            --case-highlight: #fbf7f0;
            --btn-panel-bg: #d8d0c0;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* 全体コンテナ */
        .switch-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
        }

        /* 上部ノブ・ブッシング */
        .top-bushing {
            width: 44px;
            height: 24px;
            background: linear-gradient(90deg, #111 0%, #333 30%, #444 50%, #222 70%, #111 100%);
            border-radius: 6px 6px 0 0;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.2);
            position: relative;
            z-index: 1;
        }
        .top-bushing::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 4px;
            width: 36px;
            height: 6px;
            background: #000;
            border-radius: 3px 3px 0 0;
        }

        /* 上下取り付け用耳形パーツ */
        .mount-tab {
            width: 110px;
            height: 24px;
            background: linear-gradient(90deg, var(--case-shadow), var(--case-bg) 20%, var(--case-bg) 80%, var(--case-shadow));
            border-radius: 4px 4px 0 0;
            box-shadow: inset 0 1px 2px var(--case-highlight);
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            box-sizing: border-box;
            position: absolute;
            top: 24px;
            z-index: 1;
        }
        .mount-tab.bottom {
            top: auto;
            bottom: 24px;
            transform: rotate(180deg);
        }
        .mount-hole {
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            margin-top: 5px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 1px 1px var(--case-highlight);
        }

        /* メインの本体ケース */
        .main-box {
            width: 160px;
            height: 320px;
            background: linear-gradient(135deg, var(--case-bg) 0%, #ded7ca 100%);
            border-radius: 8px;
            position: relative;
            box-shadow: 
                0 15px 30px rgba(0,0,0,0.5),
                inset 2px 2px 2px var(--case-highlight),
                inset -2px -2px 4px var(--case-shadow);
            border: 1px solid #c0b7a8;
            box-sizing: border-box;
            z-index: 2;
        }

        /* ネジ共通スタイル */
        .screw {
            position: absolute;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 40% 40%, #fff 0%, #bbb 50%, #777 90%, #444 100%);
            border-radius: 50%;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .screw::before {
            content: '';
            width: 12px;
            height: 2px;
            background: #444;
            transform: rotate(35deg);
        }
        .screw::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 12px;
            background: #444;
            transform: rotate(35deg);
        }
        .screw-tl { top: 12px; left: 12px; }
        .screw-tr { top: 12px; right: 12px; }
        .screw-bl { bottom: 12px; left: 12px; }
        .screw-br { bottom: 12px; right: 12px; }

        /* 銘板・型番ラベル */
        .nameplate {
            width: 96px;
            height: 38px;
            background-color: #ecebc8;
            margin: 35px auto 10px auto;
            border: 1px solid #a8a478;
            border-radius: 2px;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
            font-size: 8px;
            color: #222;
            padding: 3px;
            box-sizing: border-box;
            line-height: 1.2;
            font-weight: bold;
            text-align: center;
        }
        .nameplate .model {
            font-size: 11px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #a8a478;
            padding-bottom: 1px;
            margin-bottom: 2px;
        }
        .nameplate .details {
            font-size: 6px;
            transform: scale(0.9);
            display: inline-block;
        }

        /* 中央の隆起・ボタンガードパネル */
        .button-panel {
            width: 86px;
            height: 180px;
            background: linear-gradient(135deg, #ded6c7 0%, var(--case-shadow) 100%);
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 
                2px 3px 5px rgba(0,0,0,0.15),
                inset 1px 1px 3px var(--case-highlight),
                inset -2px -2px 4px rgba(0,0,0,0.15);
            border: 1px solid #bfb7a6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            box-sizing: border-box;
            padding: 12px 0;
        }

        /* ボタン共通構造 */
        .btn-frame {
            width: 48px;
            height: 48px;
            background: #1a1a1a;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 1px var(--case-highlight);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3px;
            box-sizing: border-box;
        }

        .push-button {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
        }

        /* ONボタン (黒) */
        .btn-on {
            background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
            box-shadow: 
                0 4px 0 #000,
                inset 0 1px 2px rgba(255,255,255,0.3);
            border: 1px solid #222;
        }
        .btn-on:active {
            transform: translateY(3px);
            box-shadow: 
                0 1px 0 #000,
                inset 0 1px 5px rgba(0,0,0,0.6);
        }

        /* OFFボタン (赤・突出) */
        .btn-off-container {
            transform: scale(1.08); /* OFFボタンはONより少し外側に立体的に飛び出している演出 */
        }
        .btn-off {
            background: linear-gradient(180deg, #dd3b3b 0%, #aa1b1b 100%);
            box-shadow: 
                0 6px 0 #730f0f,
                0 8px 10px rgba(0,0,0,0.5),
                inset 0 1px 2px rgba(255,255,255,0.4);
            border: 1px solid #911616;
        }
        .btn-off:active {
            transform: translateY(5px);
            box-shadow: 
                0 1px 0 #730f0f,
                inset 0 1px 5px rgba(0,0,0,0.6);
        }

        /* 下部配線導入部（2ふくらみ） */
        .bottom-bushings {
            display: flex;
            justify-content: space-between;
            width: 104px;
            position: absolute;
            bottom: -14px;
            z-index: 1;
        }
        .bottom-bushing-item {
            width: 44px;
            height: 20px;
            background: linear-gradient(90deg, #111 0%, #333 30%, #444 50%, #222 70%, #111 100%);
            border-radius: 0 0 8px 8px;
            box-shadow: inset 0 -2px 3px rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="switch-container">
        <!-- 上部ゴム部 -->
        <div class="top-bushing"></div>
        <!-- 上部取付耳 -->
        <div class="mount-tab">
            <div class="mount-hole"></div>
            <div class="mount-hole"></div>
        </div>

        <!-- メイン本体躯体 -->
        <div class="main-box">
            <!-- 四隅の固定ネジ -->
            <div class="screw screw-tl"></div>
            <div class="screw screw-tr"></div>
            <div class="screw screw-bl"></div>
            <div class="screw screw-br"></div>

            <!-- 型番銘板シール -->
            <div class="nameplate">
                <div class="model">BSW215B3</div>
                <div class="details">
                    3P 15A 220V 2.2kW<br>
                    RAIN PROOF / JET<br>
                    KASUGA PATLITE
                </div>
            </div>

            <!-- ボタンエリア（ガード枠） -->
            <div class="button-panel">
                <!-- ON ボタン -->
                <div class="btn-frame">
                    <div class="push-button btn-on">ON</div>
                </div>

                <!-- OFF ボタン（立体的に手前に飛び出す構造） -->
                <div class="btn-frame btn-off-container">
                    <div class="push-button btn-off">OFF</div>
                </div>
            </div>
        </div>

        <!-- 下部取付耳 -->
        <div class="mount-tab bottom">
            <div class="mount-hole"></div>
            <div class="mount-hole"></div>
        </div>
        <!-- 下部ノズル2つ -->
        <div class="bottom-bushings">
            <div class="bottom-bushing-item"></div>
            <div class="bottom-bushing-item"></div>
        </div>
    </div>

</body>
</html>
